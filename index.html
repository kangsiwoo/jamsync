<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>합주싱크</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="home" class="screen">
    <div class="brand">
      <h1>합주싱크</h1>
      <p class="sub">각자 이어폰으로, 같은 타이밍에.</p>
    </div>
    <label class="field">
      <span>내 이름 (파트)</span>
      <input id="name" maxlength="16" placeholder="예: 기타" autocomplete="off">
    </label>
    <button id="btn-create" class="primary wide">방 만들기</button>
    <div class="or"><span>또는</span></div>
    <div class="row">
      <input id="join-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="방 코드 6자리" autocomplete="off">
      <button id="btn-join" class="primary">참가</button>
    </div>
    <p id="home-msg" class="msg"></p>
  </main>

  <main id="room" class="screen hidden">
    <header class="room-head">
      <div>
        <div class="label">방 코드</div>
        <div id="room-code" class="code">------</div>
      </div>
      <div class="head-btns">
        <button id="btn-invite" class="ghost">초대</button>
        <button id="btn-leave" class="ghost">나가기</button>
      </div>
    </header>

    <section id="invite" class="card hidden">
      <div id="qr" class="qr"></div>
      <p id="invite-link" class="link"></p>
      <div class="row">
        <button id="btn-copy" class="wide">링크 복사</button>
        <button id="btn-share" class="wide">공유</button>
      </div>
    </section>

    <div id="conn" class="status">연결 중…</div>

    <section class="card player">
      <div class="song-row">
        <div id="song-name" class="song-name">곡 없음</div>
        <div id="host-file" class="file-btns hidden">
          <label class="btn small">파일 선택<input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac" hidden></label>
          <button id="btn-test-track" class="small ghost">테스트 음원</button>
        </div>
      </div>
      <div id="xfer" class="progress hidden"><div></div></div>
      <div class="time">
        <span id="t-cur">0:00.0</span>
        <span id="t-dur" class="dim">/ 0:00</span>
      </div>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled>
      <div class="controls">
        <button id="btn-start" class="ctl" disabled aria-label="처음으로">⏮</button>
        <button id="btn-back" class="ctl" disabled>-5초</button>
        <button id="btn-play" class="ctl primary big" disabled aria-label="재생">▶</button>
        <button id="btn-fwd" class="ctl" disabled>+5초</button>
      </div>
      <div id="countdown" class="countdown"></div>
    </section>

    <section class="card">
      <h2>멤버</h2>
      <ul id="members" class="members"></ul>
    </section>

    <section class="card">
      <h2>내 설정</h2>
      <label class="field">
        <span>볼륨</span>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
      </label>
      <label class="field">
        <span>지연 보정 <b id="lat-val">0ms</b></span>
        <input type="range" id="lat" min="-100" max="400" step="5" value="0">
      </label>
      <div class="row">
        <button id="lat-minus" class="small">-5ms</button>
        <button id="btn-click" class="wide">클릭 테스트 켜기</button>
        <button id="lat-plus" class="small">+5ms</button>
      </div>
      <p class="hint">
        블루투스 이어폰은 소리가 0.1~0.3초 늦게 나와요. 클릭 테스트를 켜고 유선 이어폰(또는 스피커) 쓰는 폰 옆에서
        딸깍 소리가 하나로 겹칠 때까지 지연 보정을 오른쪽(+)으로 옮기세요. 유선 이어폰이면 0 그대로 두세요.
      </p>
      <p id="diag" class="diag"></p>
    </section>
  </main>

  <div id="tap-overlay" class="overlay hidden">
    <button id="btn-tap" class="primary big-tap">탭해서 소리 켜기</button>
  </div>
</body>
</html>
